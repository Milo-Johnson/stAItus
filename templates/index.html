<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Container Assistant</title>
</head>
<body>
    <h1>Ask a Question About Docker Containers</h1>
    <form action="/ask" method="post">
        <label for="question">Enter your question:</label><br>
        <textarea id="question" name="question" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
    {% if question and answer %}
        <h2>Your Question:</h2>
        <p>{{ question }}</p>
        <h2>Answer:</h2>
        <div style="border: 1px solid #000; padding: 10px; background-color: #f9f9f9;">
            <p>{{ answer }}</p>
        </div>
    {% endif %}
</body>
</html>
